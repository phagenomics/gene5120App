<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamming Distance Calculator</title>  <!-- Update title to match tool -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Hamming Distance Calculator</h1>  <!-- Update title -->

        <form method="POST" class="text-center">
            <label for="sequence1">Enter Sequence 1:</label>
            <textarea name="sequence1" rows="2" cols="50" class="form-control mb-3">{{ sequence1 }}</textarea><br>

            <label for="sequence2">Enter Sequence 2:</label>
            <textarea name="sequence2" rows="2" cols="50" class="form-control mb-3">{{ sequence2 }}</textarea><br>

            <input type="submit" value="Calculate Hamming Distance" class="btn btn-primary">
        </form>

        {% if result is not none %}
            <h3 class="text-center mt-4">Hamming Distance:</h3>
            <p class="text-center font-weight-bold">{{ result }}</p>
        {% endif %}
        
        <!-- Back Home Button -->
        <div class="text-center mt-4">
            <a href="/" class="btn btn-secondary">Go Back Home</a>
        </div>
    </div>
</body>
</html>
